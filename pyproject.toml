[project]
name = "okwan"
version = "0.1.0"
description = "Okwan — the data connectivity layer built for AI agents."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "tenacity>=9.0",
    "mcp>=2.0",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "duckdb>=1.1",
    "cryptography>=43.0",
    # The support assistant (okwan_api/support.py).
    "anthropic>=2.4,<3",
]

[project.optional-dependencies]
# ruff pinned to a minor: its default rules grow between releases, and CI
# lints every file a change touches.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.17,<0.18"]

[tool.setuptools.package-data]
okwan_vault = ["*.sql"]

[tool.setuptools]
packages = { find = { where = ["packages/core", "packages/connectors/whatsapp", "packages/connectors/paystack", "packages/connectors/paypal", "packages/connectors/postgres", "packages/connectors/shopify", "packages/connectors/stripe", "packages/vault", "packages/query", "packages/recon", "packages/mcp_gen", "apps/api"] } }

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
# Depends() in a parameter default is how FastAPI declares a dependency.
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Import order is load order there: connectors register before the
# reconciliations and tables that are validated against them.
"apps/api/okwan_api/main.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
