[project]
name = "okwan"
version = "0.1.0"
description = "Okwan — the data connectivity layer built for AI agents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "tenacity>=9.0",
    "mcp>=2.0",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools]
packages = { find = { where = ["packages/core", "packages/connectors/whatsapp", "packages/connectors/paystack", "packages/connectors/postgres", "packages/connectors/shopify", "packages/connectors/stripe", "packages/query", "packages/recon", "packages/mcp_gen", "apps/api"] } }

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
