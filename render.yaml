# Reference, not applied. The live services were created in the Render
# dashboard, not from this Blueprint: the API is "okwan" (in My project,
# serving okwan.onrender.com and api.okwan.ai) and the dashboard is
# "okwan-dashboard" (okwan-dashboard.onrender.com and app.okwan.ai).
# Editing a value here changes nothing until it is also set on that
# service's Environment page. Names below match the live services.
services:
  - type: web
    name: okwan
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: OKWAN_ENV
        value: production
      # Set in the Render dashboard, not here. A durable vault refuses to
      # start without a master key — an ephemeral one would seal secrets
      # nobody could ever open again.
      - key: OKWAN_VAULT_MASTER_KEY
        sync: false
      - key: OKWAN_VAULT_DATABASE_URL
        sync: false
      # Where verification links point.
      - key: OKWAN_DASHBOARD_URL
        value: https://app.okwan.ai
      # DNS-rebinding protection for the hosted MCP (okwan_api/main.py).
      # Unset, it is off. Set it to both hosts the API answers on, then
      # confirm an MCP client still connects; delete it if clients start
      # getting invalid-host errors behind Render's proxy.
      - key: OKWAN_ALLOWED_HOSTS
        value: api.okwan.ai,okwan.onrender.com
      # Mail through Resend (okwan_api/mail.py): verification links and
      # support escalations. Set both in the Render dashboard. Mail alone
      # does not open signup: OKWAN_SIGNUP_OPEN does.
      # Use a sending-only key. OKWAN_MAIL_FROM must be an address on a
      # domain verified in Resend with SPF and DKIM, and that domain's
      # click and open tracking must be off: tracking is a domain setting
      # in Resend, and a rewritten link routes the token through Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: OKWAN_MAIL_FROM
        sync: false
      # Public signup. Unset (or anything but "true"), signup answers 503
      # "signup is not open yet" outside dev, even with mail working. Set it
      # to true once the privacy policy and terms are published
      # (OKWAN_PROJECT.md §10 item 27).
      - key: OKWAN_SIGNUP_OPEN
        sync: false
      # Lets the dashboard forward the browser's IP for per-IP rate limits.
      # Generated by Render and shared below; never typed or seen.
      - key: OKWAN_DASHBOARD_SECRET
        generateValue: true
      # The support assistant (okwan_api/support.py). Unset, it answers 503
      # and the dashboard says it is not switched on. Use a key with a
      # monthly spend limit set in the Anthropic console.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Where the assistant's escalations are mailed. Tickets are stored
      # either way: python -m okwan_vault support list.
      - key: OKWAN_SUPPORT_ESCALATION_TO
        sync: false
      # Sign-in addresses of the people who run Okwan (comma-separated).
      # Only they see the console at /ops, after an authenticator code.
      # Unset, the console does not exist for anyone.
      - key: OKWAN_OPERATOR_EMAILS
        sync: false
      # Card payments for the Pro plan, in Okwan's own Stripe account (not a
      # connector). All three, or the dashboard offers a call instead.
      # The secret key is a restricted key: Checkout Sessions and Customer
      # portal write, nothing else.
      - key: OKWAN_BILLING_STRIPE_SECRET_KEY
        sync: false
      - key: OKWAN_BILLING_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OKWAN_BILLING_PRO_PRICE_ID
        sync: false
      # Postgres DSNs may only reach public addresses. Name deliberate
      # exceptions here (hostnames or CIDRs, comma-separated).
      - key: OKWAN_EGRESS_ALLOW
        value: ""

  # Signup, connections and key issue. Server routes, not a static export:
  # the session token and every credential stay server-side.
  - type: web
    name: okwan-dashboard
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: apps/dashboard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Every MCP, REST and docs snippet on the dashboard is built from it.
      - key: OKWAN_API_URL
        value: https://api.okwan.ai
      - key: OKWAN_DASHBOARD_SECRET
        fromService:
          type: web
          name: okwan
          envVarKey: OKWAN_DASHBOARD_SECRET
