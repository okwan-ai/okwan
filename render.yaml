services:
  - type: web
    name: okwan-api
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: OKWAN_ENV
        value: production
      # Set in the Render dashboard, not here. A durable vault refuses to
      # start without a master key — an ephemeral one would seal secrets
      # nobody could ever open again.
      - key: OKWAN_VAULT_MASTER_KEY
        sync: false
      - key: OKWAN_VAULT_DATABASE_URL
        sync: false
      # Where verification links point. Signup answers 503 outside dev
      # until a mail provider is wired (okwan_api/mail.py).
      - key: OKWAN_DASHBOARD_URL
        value: https://okwan-dashboard.onrender.com
      # Lets the dashboard forward the browser's IP for per-IP rate limits.
      # Generated by Render and shared below; never typed or seen.
      - key: OKWAN_DASHBOARD_SECRET
        generateValue: true
      # Postgres DSNs may only reach public addresses. Name deliberate
      # exceptions here (hostnames or CIDRs, comma-separated).
      - key: OKWAN_EGRESS_ALLOW
        value: ""

  # Signup, connections and key issue. Server routes, not a static export:
  # the session token and every credential stay server-side.
  - type: web
    name: okwan-dashboard
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: apps/dashboard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: OKWAN_API_URL
        value: https://okwan.onrender.com
      - key: OKWAN_DASHBOARD_SECRET
        fromService:
          type: web
          name: okwan-api
          envVarKey: OKWAN_DASHBOARD_SECRET
