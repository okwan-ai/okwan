# Okwan from the outside, every ten minutes (scripts/monitor.py).
#
# A failing check opens one issue labelled `incident`, assigned to whoever
# is on call (repository variable OKWAN_ONCALL, a GitHub username), with
# each failing check linked to the runbook section that fixes it. GitHub
# notifies the assignee by email and on the GitHub mobile app. While the
# incident stays open the issue is updated only when the set of failing
# checks changes, so a long outage is one thread, not a flood. When every
# check passes again the issue is closed with the time it recovered.
#
# Optional: a Slack-compatible incoming webhook in the secret
# OKWAN_ALERT_WEBHOOK is posted to when an incident opens and closes.
#
# Scheduled runs start only once this file is on main, run late under
# GitHub load (minutes, occasionally more), and stop after 60 days with
# no commits to the repository: docs/ops/RUNBOOK.md, "Monitoring".
name: monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27"
      - name: Check
        env:
          OKWAN_MONITOR_KEY: ${{ secrets.OKWAN_MONITOR_KEY }}
        run: |
          set +e
          python scripts/monitor.py --json > result.json
          code=$?
          cat result.json
          # A crash of the monitor itself is an incident too.
          if ! python -c "import json; json.load(open('result.json'))" 2>/dev/null; then
            echo '{"ok": false, "results": [{"check": "monitor", "ok": false, "detail": "the monitor itself failed (exit '"$code"')", "runbook": "#monitoring", "seconds": 0}]}' > result.json
          fi
      - name: Open, update or close the incident
        uses: actions/github-script@v7
        env:
          ONCALL: ${{ vars.OKWAN_ONCALL || 'Marwuko' }}
          WEBHOOK: ${{ secrets.OKWAN_ALERT_WEBHOOK }}
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'incident';
            const runbook = `https://github.com/${owner}/${repo}/blob/main/docs/ops/RUNBOOK.md`;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = result.results.filter(r => !r.ok);
            const signature = failed.map(r => r.check).sort().join(',');
            const marker = s => `<!-- failing: ${s} -->`;
            const table = rows => ['| Check | What it saw | Fix |', '|---|---|---|',
              ...rows.map(r => `| \`${r.check}\` | ${r.detail.replace(/\|/g, '\\|')} | [runbook](${runbook}${r.runbook}) |`)].join('\n');
            const notify = async text => {
              if (!process.env.WEBHOOK) return;
              try { await fetch(process.env.WEBHOOK, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) }); }
              catch (e) { core.warning(`webhook failed: ${e.message}`); }
            };

            try { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'FFD400', description: 'Opened and closed by the monitor workflow' }); }
            catch (e) { if (e.status !== 422) throw e; }

            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 10 })).data;
            const incident = open[0];

            if (failed.length) {
              const body = [marker(signature), `**${failed.length} check(s) failing** as of ${result.at || 'now'} ([run](${run})).`, '', table(failed),
                '', 'Start with the runbook section for each failing check. Comment here with what you tried; close nothing by hand, the monitor closes this when every check passes.'].join('\n');
              if (!incident) {
                const created = await github.rest.issues.create({ owner, repo, title: `Incident: ${signature} failing`, body, labels: [label], assignees: [process.env.ONCALL] });
                await notify(`Okwan incident opened: ${signature} failing. ${created.data.html_url}`);
              } else if (!incident.body.includes(marker(signature))) {
                await github.rest.issues.update({ owner, repo, issue_number: incident.number, title: `Incident: ${signature} failing`, body });
                await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body: `Failing checks changed to \`${signature}\` ([run](${run})).\n\n${table(failed)}` });
              }
              core.setFailed(`failing: ${signature}`);
            } else if (incident) {
              await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body: `Every check passes again as of ${result.at || 'now'} ([run](${run})). Closing.\n\n${table(result.results)}` });
              await github.rest.issues.update({ owner, repo, issue_number: incident.number, state: 'closed', state_reason: 'completed' });
              await notify(`Okwan incident closed: every check passes. ${incident.html_url}`);
            }
