# The tenant-isolation proof (scripts/plant_leaks.py): plant each leak
# and confirm it is caught, or held by the other wall and noticed by the
# broken wall's own tests. Slow (each break reruns a suite), so it runs
# when isolation code changes, weekly, and on demand, rather than on
# every pull request.
name: isolation-proof

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/vault/**"
      - "packages/query/**"
      - "packages/recon/**"
      - "packages/connectors/paypal/okwan_paypal/auth.py"
      - "tests/test_tenant_isolation.py"
      - "tests/test_tenant_rls.py"
      - "tests/test_ops.py"
      - "scripts/plant_leaks.py"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plant-leaks:
    runs-on: ubuntu-24.04
    # 24 planted breaks, 8 of which must re-run the whole isolation suite
    # and pass (one wall broken, the other holding), so the job grows with
    # every route and tenant table the suite covers: about 25 minutes at
    # v1.50, 42 at v1.56, over 45 at v1.59. A limit, not a target.
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: okwan
          POSTGRES_PASSWORD: okwan_ci
          POSTGRES_DB: okwan_vault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okwan -d okwan_vault_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OKWAN_VAULT_DATABASE_URL: postgresql://okwan:okwan_ci@localhost:5432/okwan_vault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/plant_leaks.py
