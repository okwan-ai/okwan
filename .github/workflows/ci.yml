# Every pull request and every push to main: the Python suite against a
# real Postgres (so row-level security and both isolation walls are
# exercised, not skipped), lint on the Python a change touches, and both
# Next.js builds. A red check blocks the merge once branch protection on
# main requires it (docs/ops/RUNBOOK.md, "Branch protection").
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: okwan
          POSTGRES_PASSWORD: okwan_ci
          POSTGRES_DB: okwan_vault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okwan -d okwan_vault_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # A throwaway database in this job's container, not a secret.
      OKWAN_VAULT_DATABASE_URL: postgresql://okwan:okwan_ci@localhost:5432/okwan_vault_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint the Python this change touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' || true)
          if [ -n "$files" ]; then ruff check $files; else echo "no Python changed"; fi
      - name: Tests, with the database
        run: python -m pytest -q -p no:cacheprovider
      - name: Nothing was skipped for want of a database
        run: |
          python -m pytest -q -p no:cacheprovider -rs tests/test_tenant_isolation.py tests/test_tenant_rls.py \
            | tee isolation.txt
          ! grep -q "SKIPPED" isolation.txt

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, dashboard]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'dashboard'
        run: npm run typecheck
      - run: npm run build
