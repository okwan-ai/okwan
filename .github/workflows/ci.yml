# Every pull request and every push to main: the Python suite against a
# real Postgres (so row-level security and both isolation walls are
# exercised, not skipped), lint on the Python a change touches, both
# Next.js builds, and the dashboard's layout check. A red check blocks the merge once branch protection on
# main requires it (docs/ops/RUNBOOK.md, "Branch protection").
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: okwan
          POSTGRES_PASSWORD: okwan_ci
          POSTGRES_DB: okwan_vault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okwan -d okwan_vault_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # A throwaway database in this job's container, not a secret.
      OKWAN_VAULT_DATABASE_URL: postgresql://okwan:okwan_ci@localhost:5432/okwan_vault_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint the Python this change touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' || true)
          if [ -n "$files" ]; then ruff check $files; else echo "no Python changed"; fi
      - name: Tests, with the database
        run: python -m pytest -q -p no:cacheprovider
      - name: Nothing was skipped for want of a database
        run: |
          python -m pytest -q -p no:cacheprovider -rs tests/test_tenant_isolation.py tests/test_tenant_rls.py \
            | tee isolation.txt
          ! grep -q "SKIPPED" isolation.txt

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [web, dashboard]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'dashboard'
        run: npm run typecheck
      # What the Files tab says about a check, held to what the stored run
      # says: a batch not deposited is said to be, "every batch was
      # deposited" only when every batch was paired, and a result the page
      # does not know is never shown as paid.
      - if: matrix.app == 'dashboard'
        name: What the Files tab says about a check
        run: node scripts/check-file-checks.mjs
      - run: npm run build

      # The refund page, as a browser shows it, says the policy, whole, and
      # nothing else: the built site is served and opened, and the words on
      # the screen are compared with the file okwan_api/policy.py writes.
      # Part of the required `web (web)` check.
      - if: matrix.app == 'web'
        name: The refund page, as a browser shows it
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/check-refunds.mjs

      # The layout check (docs/ops/RUNBOOK.md, "Layout check"): the built
      # dashboard against the API with a seeded, in-memory workspace, every
      # page at four widths. Nothing may overlap, scroll sideways, or cover
      # the open account menu. Part of the required `web (dashboard)` check.
      - if: matrix.app == 'dashboard'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: matrix.app == 'dashboard'
        name: Install the API and a browser
        run: |
          pip install -e "../..[dev]"
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - if: matrix.app == 'dashboard'
        name: Start the seeded API and the dashboard
        run: |
          # A throwaway sign-in for this job's in-memory workspace, not a secret.
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "UI_CHECK_PASSWORD=$pw" >> "$GITHUB_ENV"
          export UI_CHECK_PASSWORD=$pw OKWAN_OPERATOR_EMAILS=layout@okwan.test
          nohup python ../../scripts/ui_server.py > ui_server.log 2>&1 &
          for i in $(seq 1 60); do grep -q seeded ui_server.log && break; sleep 1; done
          grep -q seeded ui_server.log || { cat ui_server.log; exit 1; }
          OKWAN_API_URL=http://127.0.0.1:8000 nohup npm start > dashboard.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/signup && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/signup || { cat dashboard.log; exit 1; }
      - if: matrix.app == 'dashboard'
        name: Layout check
        run: node scripts/layout-check.mjs
      - if: failure() && matrix.app == 'dashboard'
        uses: actions/upload-artifact@v4
        with:
          name: layout-check
          path: |
            apps/dashboard/layout-check/
            apps/dashboard/ui_server.log
            apps/dashboard/dashboard.log
          if-no-files-found: ignore
